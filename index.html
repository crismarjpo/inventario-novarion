<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventario Novarion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Firebase SDKs (Firestore Compat) -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<!-- QR Code Libraries -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<!-- Excel (.xlsx) Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#12141c;
    --surface:#1b1f2a;
    --surface-2:#232838;
    --line:#2c3242;
    --text:#e9ecf1;
    --muted:#8891a5;
    --mint:#4ade9c;
    --amber:#f2b84b;
    --violet:#a78bfa;
    --red:#f2665b;
    --tcg:#ff5722;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
  }
  .app{max-width:920px;margin:0 auto;padding:20px 16px 80px;}
 
  header.top{
    display:flex;align-items:baseline;justify-content:space-between;
    margin-bottom:18px;flex-wrap:wrap;gap:10px;
  }
  header.top h1{font-size:22px;margin:0;font-weight:700;}
  header.top h1 .stamp{
    display:inline-block;background:var(--mint);color:#0b1410;
    font-family:monospace;font-size:11px;font-weight:700;padding:2px 6px;border-radius:4px;margin-left:8px;
  }
  .header-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
 
  nav.tabs{
    display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);
    border-radius:12px;padding:4px;margin-bottom:20px;
  }
  nav.tabs button{
    flex:1;padding:10px 8px;border:none;background:transparent;color:var(--muted);
    font-size:13px;font-weight:600;border-radius:9px;cursor:pointer;font-family:inherit;transition:.15s;
  }
  nav.tabs button.active{background:var(--surface-2);color:var(--text);}
 
  .panel{display:none;}
  .panel.active{display:block;}
 
  .btn.danger{background:rgba(242,102,91,.15);color:var(--red);}
 
  .cat-filter{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .cat-filter button{
    flex:1;min-width:100px;display:flex;align-items:center;justify-content:center;gap:6px;
    padding:10px 12px;border:1px solid var(--line);background:var(--surface);color:var(--muted);
    border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:.15s;
  }
  .cat-filter button.active{background:var(--surface-2);color:var(--text);border-color:var(--mint);}
  .cat-filter button:hover:not(.active){color:var(--text);}
 
  .toolbar{display:flex;gap:8px;margin-bottom:14px;}
  .toolbar input[type=text]{
    flex:1;background:var(--surface);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:10px;font-size:14px;font-family:inherit;
  }
  .toolbar input[type=text]:focus{outline:none;border-color:var(--mint);}
 
  .empty{text-align:center;padding:60px 20px;color:var(--muted);border:1px dashed var(--line);border-radius:14px;}
  .empty b{color:var(--text);display:block;margin-bottom:4px;font-size:15px;}
 
  .grid{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
 
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:14px;
    padding:14px;position:relative;overflow:hidden;
  }
  .card::before{content:"";position:absolute;top:0;left:0;width:4px;height:100%;}
  .card.novarion::before{background:#5b6478;}
  .card.pokemon::before{background:var(--violet);}
 
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;}
  .card-name{font-size:15px;font-weight:700;line-height:1.3;}
  .card-name-input{
    font-size:15px;font-weight:700;line-height:1.3;color:var(--text);
    background:transparent;border:1px solid transparent;border-radius:6px;
    padding:2px 4px;margin:-2px -4px;font-family:inherit;width:100%;flex:1;min-width:0;
  }
  .card-name-input:hover{border-color:var(--line);}
  .card-name-input:focus{outline:none;border-color:var(--mint);background:var(--surface-2);}
  .badge{
    font-family:monospace;font-size:10px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap;
  }
  .badge.novarion{background:#2a2f3d;color:#aab2c5;}
  .badge.pokemon{background:rgba(167,139,250,.15);color:var(--violet);}
 
  .card-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin:8px 0;align-items:center;}
  .card-row b{color:var(--text);font-family:monospace;font-weight:600;}
 
  .qty-pill{
    display:inline-flex;align-items:center;gap:2px;font-family:monospace;
    font-weight:700;font-size:13px;background:var(--surface-2);padding:3px 10px;border-radius:20px;
  }
  .qty-pill.low{color:var(--red);}
  .qty-stepper{display:flex;align-items:center;gap:8px;}
  .qty-stepper button{
    width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);
    color:var(--text);font-size:15px;font-weight:700;cursor:pointer;line-height:1;padding:0;
  }
  .qty-stepper button:hover{border-color:var(--mint);}
 
  .price-box{
    margin-top:10px;padding-top:10px;border-top:1px solid var(--line);
    display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);
  }
  .price-line{display:flex;justify-content:space-between;align-items:center;}
  .price-input-wrap{
    display:flex;align-items:center;gap:4px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:8px;padding:3px 8px;width:130px;
  }
  .price-input-wrap input{
    width:100%;background:transparent;border:none;color:var(--mint);
    font-family:monospace;font-size:14px;font-weight:700;text-align:right;
  }
  .price-input-wrap input:focus{outline:none;}
 
  .card-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .select-status{
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:5px 8px;border-radius:8px;font-size:12px;font-family:inherit;cursor:pointer;font-weight:600;
  }
 
  .btn{
    border:none;border-radius:8px;padding:7px 11px;font-size:12px;font-weight:600;
    cursor:pointer;font-family:inherit;transition:opacity .15s;text-decoration:none;display:inline-block;text-align:center;
  }
  .btn:hover{opacity:.85;}
  .btn.primary{background:var(--mint);color:#0b1410;}
  .btn.ghost{background:var(--surface-2);color:var(--text);}
  .btn.tcg{background:rgba(255,87,34,0.15);color:#ff8a65;border:1px solid rgba(255,87,34,0.3);}
  .btn.small{padding:5px 9px;font-size:11px;}
 
  .form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600;}
  .field input,.field select{
    width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:9px;font-size:14px;font-family:inherit;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--mint);}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .cat-select{display:flex;gap:8px;}
  .cat-select label{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
    background:var(--surface-2);border:1px solid var(--line);border-radius:10px;
    padding:10px 6px;cursor:pointer;font-size:11px;color:var(--muted);font-weight:600;text-align:center;
  }
  .cat-select input{display:none;}
  .cat-select label.checked{border-color:var(--mint);color:var(--text);background:rgba(74,222,156,.08);}
 
  .card.highlight{border-color:var(--mint);box-shadow:0 0 0 3px rgba(74,222,156,.35);transition:box-shadow .2s;}
 
  .search-wrap{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;}
  .match-card{background:var(--surface-2);border:1px solid var(--mint);border-radius:14px;padding:16px;margin-top:14px;text-align:left;}

  .divider-or{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:12px;font-weight:600;}
  .divider-or::before,.divider-or::after{content:"";flex:1;height:1px;background:var(--line);}

  video{width:100%;max-width:420px;border-radius:12px;background:#000;object-fit:cover;}
  .scan-frame{position:relative;display:inline-block;}
  .scan-corner{position:absolute;width:32px;height:32px;border:3px solid var(--mint);pointer-events:none;}
  .scan-corner.tl{top:8px;left:8px;border-right:none;border-bottom:none;}
  .scan-corner.tr{top:8px;right:8px;border-left:none;border-bottom:none;}
  .scan-corner.bl{bottom:8px;left:8px;border-right:none;border-top:none;}
  .scan-corner.br{bottom:8px;right:8px;border-left:none;border-top:none;}
  .scan-status{color:var(--mint);font-size:13px;margin-top:12px;font-family:monospace;font-weight:700;}

  .qr-box{display:inline-block;background:#fff;padding:14px;border-radius:12px;margin:14px 0;}
  .modal-overlay{
    display:none;position:fixed;inset:0;background:rgba(8,9,14,.8);z-index:100;
    align-items:center;justify-content:center;padding:20px;
  }
  .modal-box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center;max-width:340px;width:100%;}
 
  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    padding:10px 18px;border-radius:10px;font-size:13px;z-index:50;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Inventario Novarion <span class="stamp">PRO</span></h1>
    <div class="header-actions">
      <span class="count" id="headerCount" style="font-size:13px;font-family:monospace;color:var(--muted);">0 prod.</span>
      <button class="btn ghost small" id="btnExport">Exportar Excel (.xlsx)</button>
    </div>
  </header>
 
  <nav class="tabs">
    <button data-tab="list" class="active">Inventario</button>
    <button data-tab="add">Agregar</button>
    <button data-tab="scan">Buscar</button>
  </nav>
 
  <!-- INVENTARIO -->
  <section class="panel active" id="panel-list">
    <div class="cat-filter" id="catFilter">
      <button class="active" data-catfilter="novarion">🏷️ Novarion</button>
      <button data-catfilter="pokemon">🃏 Pokémon</button>
    </div>
    <div class="toolbar">
      <input type="text" id="searchBox" placeholder="Buscar producto...">
    </div>
    <div id="listContainer"></div>
  </section>
 
  <!-- AGREGAR -->
  <section class="panel" id="panel-add">
    <div class="form" style="padding:14px 18px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <div style="flex:1;min-width:140px;">
        <label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;">Tasa USD por defecto</label>
        <input type="number" id="globalDolar" value="4000" style="background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px;font-size:13px;font-family:monospace;width:100%;">
      </div>
      <div style="flex:1;min-width:140px;">
        <label style="font-size:11px;color:var(--muted);font-weight:600;display:block;margin-bottom:4px;">Margen ganancia (%)</label>
        <input type="number" id="globalMargin" value="35" style="background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:8px;border-radius:8px;font-size:13px;font-family:monospace;width:100%;">
      </div>
    </div>
 
    <div id="addFormWrap" class="form">
      <div class="field">
        <label>Categoría</label>
        <div class="cat-select" id="catSelect">
          <label class="checked" data-cat="novarion"><input type="radio" name="cat" value="novarion" checked>🏷️<br>Novarion</label>
          <label data-cat="pokemon"><input type="radio" name="cat" value="pokemon">🃏<br>Pokémon</label>
        </div>
      </div>
 
      <div class="field">
        <label>Nombre del producto</label>
        <div style="display:flex; gap:6px;">
          <input type="text" id="f_name" placeholder="Ej: Charizard ex 135/214" style="flex:1;">
          <a id="f_tcg_btn" href="#" target="_blank" class="btn tcg" style="display:none; align-items:center; gap:4px; padding:0 12px; font-size:12px;">🔍 TCGplayer</a>
        </div>
      </div>
 
      <div class="field-row">
        <div class="field">
          <label>Cantidad inicial</label>
          <input type="number" id="f_qty" value="1" min="0">
        </div>
        <div class="field">
          <label>Precio USD</label>
          <input type="number" id="f_usd" placeholder="0.00" step="0.01" min="0">
        </div>
      </div>
 
      <div class="field-row">
        <div class="field">
          <label>Costo Base (COP)</label>
          <input type="number" id="f_cost" placeholder="Automático" min="0">
        </div>
        <div class="field">
          <label>Precio real de venta</label>
          <input type="number" id="f_sell" placeholder="Sugerido">
        </div>
      </div>
 
      <button class="btn primary" id="btnCreate" style="width:100%;padding:12px;font-size:14px;margin-top:6px;">Crear producto</button>
    </div>
  </section>
 
  <!-- BUSCAR -->
  <section class="panel" id="panel-scan">
    <div class="search-wrap">
      <p style="color:var(--muted);font-size:13px;margin-bottom:10px;text-align:left;">Busca el producto por nombre y te llevamos directo a su tarjeta en el Inventario, donde puedes editar cantidad, precio, etc.:</p>
      <input type="text" id="quickSearchBox" placeholder="Escribe el nombre del producto..." style="width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:9px;font-size:14px;font-family:inherit;">
      <div id="quickSearchResults" style="text-align:left;margin-top:8px;"></div>

      <div class="divider-or">o</div>

      <div id="scanStartWrap" style="text-align:center;">
        <p style="color:var(--muted);font-size:13px;margin-bottom:14px;">Escanea el QR del producto y te llevamos a su tarjeta.</p>
        <button class="btn primary" id="btnStartScan" style="padding:12px 20px;">Escanear QR</button>
      </div>
      <div id="scanVideoWrap" style="display:none;text-align:center;">
        <div class="scan-frame">
          <video id="video" playsinline muted autoplay></video>
          <div class="scan-corner tl"></div>
          <div class="scan-corner tr"></div>
          <div class="scan-corner bl"></div>
          <div class="scan-corner br"></div>
        </div>
        <div class="scan-status" id="scanStatus">Buscando código QR... enfoca bien</div>
        <button class="btn ghost" id="btnStopScan" style="margin-top:10px;">Detener cámara</button>
      </div>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>
  </section>

  <!-- MODAL QR -->
  <div class="modal-overlay" id="qrModalOverlay">
    <div class="modal-box">
      <div id="qrModalName" style="font-weight:700;font-size:15px;margin-bottom:14px;"></div>
      <div class="qr-box" id="qrModalTarget" style="margin:0 auto 14px;"></div>
      <div style="display:flex;gap:8px;">
        <button class="btn ghost" id="btnPrintQr" style="flex:1;">Imprimir</button>
        <button class="btn primary" id="btnCloseQr" style="flex:1;">Cerrar</button>
      </div>
    </div>
  </div>
</div>
 
<script>
// Tus credenciales exactas de Firebase Firestore
const firebaseConfig = {
  apiKey: "AIzaSyBEE4EWjv0tAdEl5Sl90pbGc3SUQPfWJHA",
  authDomain: "inventario-novarion.firebaseapp.com",
  projectId: "inventario-novarion",
  storageBucket: "inventario-novarion.appspot.com",
  messagingSenderId: "714228837272",
  appId: "1:714228837272:web:1bff02fa4edbabaa5119ed"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let products = [];
let settings = { dolar: 4000, margin: 35 };
const CATS = { novarion:{label:'Novarion', icon:'🏷️'}, pokemon:{label:'Pokémon', icon:'🃏'} };
 
function fmtCOP(n){ return n ? '$' + Math.round(n).toLocaleString('es-CO') : '—'; }
function uid(){ return 'P' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function toast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2000);
}
 
function logMovement(product, tipo, detalle){
  if(!product.movements) product.movements = [];
  const fecha = new Date().toLocaleString('es-CO');
  const itemDolar = product.dolar !== undefined ? product.dolar : settings.dolar;
  product.movements.push({
    fecha,
    tipo,
    detalle,
    usd: product.usd || 0,
    dolar: itemDolar,
    cost: product.cost || 0,
    sellPrice: product.sellPrice || 0
  });
}
 
function saveData(){
  db.collection('inventario').doc('datos').set({ products, settings })
    .catch(err => console.error("Error al guardar:", err));
}
 
window.addEventListener('DOMContentLoaded', () => {
  db.collection('inventario').doc('datos').onSnapshot((doc) => {
    if(doc.exists){
      const data = doc.data();
      products = data.products || [];
      settings = data.settings || settings;
    }
    document.getElementById('globalDolar').value = settings.dolar;
    document.getElementById('globalMargin').value = settings.margin;
    renderList();
    updateAddTcgBtn();
  }, (err) => {
    console.error("Error al leer Firestore:", err);
  });
});
 
document.getElementById('globalDolar').addEventListener('input', (e)=>{
  settings.dolar = parseFloat(e.target.value)||4000;
  saveData(); recalcAddForm();
});
document.getElementById('globalMargin').addEventListener('input', (e)=>{
  settings.margin = parseFloat(e.target.value)||35;
  saveData(); recalcAddForm();
});
 
function recalcAddForm(){
  const usd = parseFloat(document.getElementById('f_usd').value)||0;
  const costF = document.getElementById('f_cost');
  const sellF = document.getElementById('f_sell');
  let baseCost = costF.dataset.manual ? parseFloat(costF.value)||0 : (usd > 0 ? usd * settings.dolar : 0);
  if(!costF.dataset.manual && usd > 0) costF.value = Math.round(baseCost);
  if(!sellF.dataset.manual && baseCost > 0) sellF.value = Math.round(baseCost * (1 + settings.margin/100));
}
document.getElementById('f_usd').addEventListener('input', ()=>{ document.getElementById('f_cost').dataset.manual=''; recalcAddForm(); });
document.getElementById('f_cost').addEventListener('input', ()=>{ document.getElementById('f_cost').dataset.manual='1'; recalcAddForm(); });
document.getElementById('f_sell').addEventListener('input', ()=>{ document.getElementById('f_sell').dataset.manual='1'; });
 
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab!=='scan') stopScan();
  });
});
 
document.querySelectorAll('#catSelect label').forEach(lbl=>{
  lbl.addEventListener('click', ()=>{
    document.querySelectorAll('#catSelect label').forEach(l=>l.classList.remove('checked'));
    lbl.classList.add('checked');
    const radio = lbl.querySelector('input');
    if(radio) radio.checked = true;
    updateAddTcgBtn();
  });
});
 
function updateAddTcgBtn(){
  const checkedRadio = document.querySelector('#catSelect input[name=cat]:checked');
  const cat = checkedRadio ? checkedRadio.value : 'novarion';
  const nameVal = document.getElementById('f_name').value.trim();
  const tcgBtn = document.getElementById('f_tcg_btn');
  if(cat === 'pokemon'){
    tcgBtn.style.display = 'inline-flex';
    tcgBtn.href = 'https://www.tcgplayer.com/search/all/product?q=' + encodeURIComponent(nameVal || 'pokemon');
  } else {
    tcgBtn.style.display = 'none';
  }
}
 
document.getElementById('f_name').addEventListener('input', updateAddTcgBtn);
 
document.getElementById('btnCreate').addEventListener('click', ()=>{
  const name = document.getElementById('f_name').value.trim();
  if(!name){ toast('Escribe un nombre'); return; }
  const checkedRadio = document.querySelector('#catSelect input[name=cat]:checked');
  const cat = checkedRadio ? checkedRadio.value : 'novarion';
  const qty = parseInt(document.getElementById('f_qty').value)||0;
  const usd = parseFloat(document.getElementById('f_usd').value)||0;
  const dolarItem = settings.dolar;
  const cost = parseFloat(document.getElementById('f_cost').value)||(usd>0?usd*dolarItem:0);
  const sellPrice = parseFloat(document.getElementById('f_sell').value)||Math.round(cost*(1+settings.margin/100));
 
  const product = { id:uid(), name, category:cat, qty, usd, dolar:dolarItem, cost, sellPrice, status:'Disponible', movements:[] };
  logMovement(product, 'Creación', `Creado con stock inicial: ${qty}`);
  products.push(product);
  saveData();
  renderList();

  toast('Producto creado ✓');
 
  document.getElementById('f_name').value='';
  document.getElementById('f_qty').value='1';

document.getElementById('btnExport').addEventListener('click', ()=>{
  const wb = XLSX.utils.book_new();

  // Hojas por categoría: movimientos agrupados por producto (creación -> modificaciones -> salida),
  // sin mezclar el historial de un producto con el de otro.
  function buildCategorySheet(cat){
    const rows = [['ID Producto','Nombre','Fecha y Hora','Tipo de Movimiento','USD','Tasa','Costo Base','Venta','Detalle']];
    products.filter(p => p.category === cat).forEach(p => {
      rows.push([`— ${p.name} —`]);
      if(p.movements && p.movements.length > 0){
        p.movements.forEach(m => {
          rows.push([p.id, p.name, m.fecha, m.tipo, m.usd, m.dolar, m.cost, m.sellPrice, m.detalle]);
        });
      } else {
        rows.push(['(sin movimientos registrados)']);
      }
      rows.push([]); // fila en blanco entre productos
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:14},{wch:26},{wch:20},{wch:22},{wch:10},{wch:10},{wch:12},{wch:12},{wch:40}];
    return ws;
  }

  XLSX.utils.book_append_sheet(wb, buildCategorySheet('novarion'), 'Novarion');
  XLSX.utils.book_append_sheet(wb, buildCategorySheet('pokemon'), 'Pokemon');

  // Hojas por estado: productos con su categoría y última modificación
  function buildStatusSheet(status){
    const rows = [['Categoría','Nombre','Cantidad','Precio USD','Costo Base','Precio Venta','Última Modificación','Último Movimiento']];
    products.filter(p => p.status === status).forEach(p => {
      const lm = (p.movements && p.movements.length) ? p.movements[p.movements.length - 1] : null;
      rows.push([
        CATS[p.category].label,
        p.name,
        p.qty,
        p.usd || 0,
        p.cost,
        p.sellPrice,
        lm ? lm.fecha : '',
        lm ? `${lm.tipo}: ${lm.detalle}` : ''
      ]);
    });
    const ws = XLSX.utils.aoa_to_sheet(rows);
    ws['!cols'] = [{wch:14},{wch:26},{wch:10},{wch:12},{wch:12},{wch:12},{wch:20},{wch:40}];
    return ws;
  }

  XLSX.utils.book_append_sheet(wb, buildStatusSheet('Disponible'), 'Disponibles');
  XLSX.utils.book_append_sheet(wb, buildStatusSheet('Reservado'), 'Reservados');
  XLSX.utils.book_append_sheet(wb, buildStatusSheet('Vendido'), 'Vendidos');

  XLSX.writeFile(wb, 'inventario_novarion.xlsx');
});
 
let currentCatFilter = 'novarion';
document.getElementById('catFilter').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-catfilter]');
  if(!btn) return;
  document.querySelectorAll('#catFilter button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentCatFilter = btn.dataset.catfilter;
  renderList();
});

function renderList(){
  const query = (document.getElementById('searchBox').value||'').toLowerCase();
  const container = document.getElementById('listContainer');
  const filtered = products.filter(p=>
    p.name.toLowerCase().includes(query) &&
    (currentCatFilter==='all' || p.category===currentCatFilter)
  );
  document.getElementById('headerCount').textContent = products.length + ' prod.';
 
  if(filtered.length===0){
    container.innerHTML = `<div class="empty"><b>${products.length===0?'Inventario vacío':'Sin resultados'}</b>${products.length===0?'Agrega tu primer producto.':''}</div>`;
    return;
  }
 
  container.innerHTML = '<div class="grid">'+filtered.map(p=>{
    const itemDolar = p.dolar !== undefined ? p.dolar : settings.dolar;
    const tcgUrl = 'https://www.tcgplayer.com/search/all/product?q=' + encodeURIComponent(p.name);
    return `<div class="card ${p.category}" id="prodcard-${p.id}">
      <div class="card-top">
        <input type="text" class="card-name-input" data-name-input data-id="${p.id}" value="${escapeHtml(p.name)}">
        <span class="badge ${p.category}">${CATS[p.category].icon} ${CATS[p.category].label}</span>
      </div>
      <div class="card-row"><span>Cantidad</span>
        <span class="qty-stepper">
          <button data-action="qty-dec" data-id="${p.id}" ${p.qty<=0?'disabled':''}>−</button>
          <span class="qty-pill ${p.qty<=2?'low':''}">${p.qty} u.</span>
          <button data-action="qty-inc" data-id="${p.id}">+</button>
        </span>
      </div>
      <div class="card-row"><span>Precio USD</span>
        <div class="price-input-wrap"><span>US$</span><input type="number" step="0.01" value="${p.usd||0}" data-usd-input data-id="${p.id}"></div>
      </div>
      <div class="card-row"><span>Tasa de cambio</span>
        <div class="price-input-wrap"><span>$</span><input type="number" value="${itemDolar}" data-dolar-input data-id="${p.id}"></div>
      </div>
      <div class="card-row"><span>Costo Base (COP)</span> <b>${fmtCOP(p.cost)}</b></div>
      <div class="price-box">
        <div class="price-line"><span>Precio real de venta</span>
          <div class="price-input-wrap"><span>$</span><input type="number" value="${p.sellPrice}" data-sell-input data-id="${p.id}"></div>
        </div>
      </div>
      <div class="card-actions">
        <select class="select-status" data-status-select data-id="${p.id}">
          <option value="Disponible" ${p.status==='Disponible'?'selected':''}>🟢 Disponible</option>
          <option value="Reservado" ${p.status==='Reservado'?'selected':''}>🟡 Reservado</option>
          <option value="Vendido" ${p.status==='Vendido'?'selected':''}>🔴 Vendido</option>
        </select>
        <div style="display:flex;gap:6px;">
          ${p.category === 'pokemon' ? `<a href="${tcgUrl}" target="_blank" class="btn tcg small">🔍 TCGplayer</a>` : ''}
          <button class="btn ghost small" data-action="qr" data-id="${p.id}">QR</button>
          <button class="btn danger small" data-action="delete" data-id="${p.id}">Eliminar</button>
        </div>
      </div>
    </div>`;
  }).join('')+'</div>';
}
function escapeHtml(s){ const d = document.createElement('div'); d.textContent=s; return d.innerHTML; }
document.getElementById('searchBox').addEventListener('input', renderList);
 
document.getElementById('listContainer').addEventListener('change', (e)=>{
  const p = products.find(x=>x.id===e.target.dataset.id);
  if(!p) return;
  if(e.target.matches('[data-sell-input]')){
    const val = parseFloat(e.target.value)||0;
    p.sellPrice = val;
    logMovement(p, 'Modificación', `Precio de venta actualizado a $${val}`);
  }
  if(e.target.matches('[data-name-input]')){
    const val = e.target.value.trim();
    if(!val){
      e.target.value = p.name; // no permitir nombre vacío
      return;
    }
    if(val !== p.name){
      const oldName = p.name;
      p.name = val;
      logMovement(p, 'Modificación', `Nombre actualizado de "${oldName}" a "${val}"`);
    }
  }
  if(e.target.matches('[data-usd-input]')){
    p.usd = parseFloat(e.target.value)||0;
    const rate = p.dolar !== undefined ? p.dolar : settings.dolar;
    p.cost = Math.round(p.usd * rate);
    p.sellPrice = Math.round(p.cost * (1 + settings.margin/100));
    logMovement(p, 'Modificación', `Precio USD actualizado a US$${p.usd}`);
  }
  if(e.target.matches('[data-dolar-input]')){
    p.dolar = parseFloat(e.target.value)||settings.dolar;
    p.cost = Math.round((p.usd||0) * p.dolar);
    p.sellPrice = Math.round(p.cost * (1 + settings.margin/100));
    logMovement(p, 'Modificación', `Tasa de cambio individual actualizada a $${p.dolar}`);
  }
  if(e.target.matches('[data-status-select]')){
    p.status = e.target.value;
    logMovement(p, 'Cambio de Estado', `Estado cambiado a: ${p.status}`);
  }
  saveData(); renderList(); toast('Actualizado');
});
 
document.getElementById('listContainer').addEventListener('click', (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const p = products.find(x=>x.id===btn.dataset.id);
  if(!p) return;
  if(btn.dataset.action==='qty-dec' && p.qty>0){
    p.qty--;
    logMovement(p, 'Salida', `Se restó -1 unidad. Stock restante: ${p.qty}`);
    saveData(); renderList();
  }
  if(btn.dataset.action==='qty-inc'){
    p.qty++;
    logMovement(p, 'Entrada', `Se sumó +1 unidad. Stock actual: ${p.qty}`);
    saveData(); renderList();
  }
  if(btn.dataset.action==='qr'){
    document.getElementById('qrModalName').textContent = p.name;
    const t = document.getElementById('qrModalTarget'); t.innerHTML='';
    new QRCode(t, {text:'INV:'+p.id, width:220, height:220, correctLevel: QRCode.CorrectLevel.M});
    document.getElementById('qrModalOverlay').style.display='flex';
  }
  if(btn.dataset.action==='delete'){
    if(confirm(`¿Eliminar "${p.name}" definitivamente del inventario? Esta acción no se puede deshacer.`)){
      products = products.filter(x=>x.id!==p.id);
      saveData(); renderList();
      toast('Producto eliminado');
    }
  }
});

document.getElementById('btnCloseQr').addEventListener('click', ()=>{
  document.getElementById('qrModalOverlay').style.display='none';
});

  const html = document.getElementById('qrModalTarget').innerHTML;

// MOTOR DE CÁMARA Y ESCANEO QR
let scanStream=null, scanLoopId=null, scanPaused=false;
let nativeDetector=null;
// BarcodeDetector = el mismo lector nativo del sistema (tipo Google Lens) que usan
// las apps para emparejar TVs, WhatsApp Web, etc. Es mucho más robusto que leer
// la imagen a mano con jsQR, así que lo usamos cuando el navegador lo soporta.
if('BarcodeDetector' in window){
  try{ nativeDetector = new BarcodeDetector({ formats: ['qr_code'] }); }catch(e){ nativeDetector = null; }
}

document.getElementById('btnStartScan').addEventListener('click', startScan);
document.getElementById('btnStopScan').addEventListener('click', stopScan);

async function startScan(){
  try{
    scanStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1280, max: 1920 },
        height: { ideal: 720, max: 1080 }
      }
    });
  }catch(e){
    toast('No se pudo acceder a la cámara');
    return;
  }

  // Forzar enfoque continuo cuando el navegador lo soporte (evita que la imagen
  // quede borrosa al acercar el QR después del enfoque inicial)
  try{
    const [track] = scanStream.getVideoTracks();
    const capabilities = track.getCapabilities ? track.getCapabilities() : {};
    if(capabilities.focusMode && capabilities.focusMode.includes('continuous')){
      await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    }
  }catch(focusErr){
    console.warn('No se pudo forzar enfoque continuo:', focusErr);
  }

  const v = document.getElementById('video');
  v.srcObject = scanStream;
  v.setAttribute('playsinline', true);
  await v.play();
  document.getElementById('scanStartWrap').style.display='none';
  document.getElementById('scanVideoWrap').style.display='block';
  document.getElementById('scanStatus').textContent = nativeDetector
    ? 'Buscando código QR (modo nativo)...'
    : 'Buscando código QR... enfoca bien';
  scanPaused=false;
  scanLoop();
}

function stopScan(){
  if(scanLoopId) cancelAnimationFrame(scanLoopId);
  scanLoopId=null;
  if(scanStream){
    scanStream.getTracks().forEach(t=>t.stop());
    scanStream=null;
  }
  document.getElementById('scanStartWrap').style.display='block';
  document.getElementById('scanVideoWrap').style.display='none';
}

function handleScannedText(text){
  let scannedId = text;
  if(scannedId.startsWith('INV:')) scannedId = scannedId.slice(4);

  const p = products.find(x => x.id === scannedId);
  if(p){
    scanPaused = true;
    document.getElementById('scanStatus').textContent = '¡Producto encontrado! ✓';
    stopScan();
    toast('Producto encontrado: ' + p.name);
    goToProduct(p);
  } else {
    toast('QR leído, pero el producto no existe');
  }
}

async function scanLoop(){
  const v = document.getElementById('video');
  if(scanPaused){ scanLoopId = requestAnimationFrame(scanLoop); return; }

  if(v.readyState === v.HAVE_ENOUGH_DATA){
    if(nativeDetector){
      // Camino rápido: lector nativo del sistema, directo sobre el video.
      try{
        const barcodes = await nativeDetector.detect(v);
        if(barcodes && barcodes.length > 0 && barcodes[0].rawValue){
          handleScannedText(barcodes[0].rawValue);
          return; // scanPaused ya detuvo el loop dentro de handleScannedText si hubo match
        }
      }catch(e){
        // Si falla el detector nativo en este frame, seguimos con el loop normal
      }
    } else {
      // Respaldo: jsQR sobre un canvas, para navegadores sin BarcodeDetector (ej. iOS Safari)
      const c = document.getElementById('canvas');
      c.width = v.videoWidth;
      c.height = v.videoHeight;
      const ctx = c.getContext('2d', {willReadFrequently: true});
      ctx.drawImage(v, 0, 0, c.width, c.height);
      const imgData = ctx.getImageData(0, 0, c.width, c.height);
      const code = jsQR(imgData.data, imgData.width, imgData.height);
      if(code && code.data){
        handleScannedText(code.data);
        return;
      }
    }
  }
  scanLoopId = requestAnimationFrame(scanLoop);
}

// BÚSQUEDA RÁPIDA (pestaña Buscar)
function renderQuickResults(){
  const q = document.getElementById('quickSearchBox').value.trim().toLowerCase();
  const box = document.getElementById('quickSearchResults');
  if(!q){ box.innerHTML=''; return; }
  const matches = products.filter(p=>p.name.toLowerCase().includes(q)).slice(0,8);
  if(matches.length===0){
    box.innerHTML = `<div style="color:var(--muted);font-size:13px;padding:8px 2px;">Sin resultados</div>`;
    return;
  }
  box.innerHTML = matches.map(p=>`
    <div data-quick-id="${p.id}" style="display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px;cursor:pointer;">
      <span style="font-size:13px;font-weight:600;">${escapeHtml(p.name)}</span>
      <span class="qty-pill ${p.qty<=2?'low':''}" style="pointer-events:none;">${p.qty} u.</span>
    </div>`).join('');
}
document.getElementById('quickSearchBox').addEventListener('input', renderQuickResults);
document.getElementById('quickSearchResults').addEventListener('click', (e)=>{
  const row = e.target.closest('[data-quick-id]');
  if(!row) return;
  const p = products.find(x=>x.id===row.dataset.quickId);
  if(!p) return;
  document.getElementById('quickSearchBox').value = '';
  document.getElementById('quickSearchResults').innerHTML = '';
  goToProduct(p);
});

function goToProduct(p){
  // Cambia a la pestaña Inventario
  document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(pn=>pn.classList.remove('active'));
  document.querySelector('nav.tabs button[data-tab="list"]').classList.add('active');
  document.getElementById('panel-list').classList.add('active');

  // Limpia el filtro de texto y cambia al filtro de la categoría del producto encontrado
  document.getElementById('searchBox').value = '';
  currentCatFilter = p.category;
  document.querySelectorAll('#catFilter button').forEach(b=>b.classList.remove('active'));
  document.querySelector(`#catFilter button[data-catfilter="${p.category}"]`).classList.add('active');
  renderList();

  // Hace scroll hasta la tarjeta y la resalta un momento
  requestAnimationFrame(()=>{
    const el = document.getElementById('prodcard-'+p.id);
    if(el){
      el.scrollIntoView({behavior:'smooth', block:'center'});
      el.classList.add('highlight');
      setTimeout(()=>el.classList.remove('highlight'), 1800);
    }
  });
}
